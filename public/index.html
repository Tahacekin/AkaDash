<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AkaDash — Atlas LMS</title>
  <style>
    :root {
      font-family: system-ui, Segoe UI, sans-serif;
      background: #0f1419;
      color: #e7e9ea;
    }
    body {
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
    .sub { color: #71767b; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .hint {
      background: #1d2935;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      color: #c4cdd6;
      margin-bottom: 1.25rem;
    }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      border: 1px solid #38444d;
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 0.75rem;
    }
    li strong { display: block; margin-bottom: 0.35rem; }
    .meta { font-size: 0.85rem; color: #8b98a5; }
    a { color: #1d9bf0; }
    .err { color: #f4212e; }
  </style>
</head>
<body>
  <h1>AkaDash</h1>
  <p class="sub">Atlas LMS ödevleri — <span id="source">yükleniyor…</span></p>
  <p id="hint" class="hint" hidden></p>
  <ul id="list"></ul>
  <p id="error" class="err"></p>

  <script>
    async function load() {
      const listEl = document.getElementById('list');
      const sourceEl = document.getElementById('source');
      const hintEl = document.getElementById('hint');
      const errEl = document.getElementById('error');

      try {
        const res = await fetch('/api/lms/assignments');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);

        sourceEl.textContent =
          data.source === 'mock'
            ? 'mock veri (token yok)'
            : data.source === 'moodle'
              ? 'Atlas LMS (canlı)'
              : data.source === 'error'
                ? 'canlı veri hatası'
                : data.source === 'stub'
                  ? 'stub'
                  : data.source || 'bilinmiyor';

        if (data.error || data.hint) {
          hintEl.hidden = false;
          hintEl.textContent = [data.error, data.hint].filter(Boolean).join('\n\n');
          hintEl.style.borderLeft =
            data.source === 'error' ? '3px solid #f4212e' : 'none';
        }

        listEl.innerHTML = '';
        for (const a of data.assignments || []) {
          const due = a.dueAt
            ? new Date(a.dueAt).toLocaleString('tr-TR')
            : '—';
          const li = document.createElement('li');
          li.innerHTML =
            '<strong>' +
            escapeHtml(a.title) +
            '</strong>' +
            '<span class="meta">' +
            escapeHtml(a.courseName) +
            ' · Son teslim: ' +
            due +
            '</span>';
          if (a.assignmentUrl) {
            const p = document.createElement('p');
            const link = document.createElement('a');
            link.href = a.assignmentUrl;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = 'LMS’te aç';
            p.appendChild(link);
            li.appendChild(p);
          }
          listEl.appendChild(li);
        }
      } catch (e) {
        errEl.textContent = String(e.message || e);
      }
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    load();
  </script>
</body>
</html>
